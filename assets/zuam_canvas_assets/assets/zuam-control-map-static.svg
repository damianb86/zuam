<svg width="1448" height="1086" viewBox="0 0 1448 1086" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Zuam living control map</title>
  <desc id="desc">Hero canvas reference: a living Z route that turns input signals into pattern recognition, automation and scale.</desc>
  <defs>
    <pattern id="grid" width="92" height="92" patternUnits="userSpaceOnUse">
      <path d="M92 0H0V92" stroke="#D9DEEA" stroke-opacity="0.55" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#AAB2C5" fill-opacity="0.45"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#071226" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.25 0 0 0 0 1 0 0 0 .65 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="neon" x1="400" y1="800" x2="980" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="0.48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="violetCore" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(724 543) rotate(90) scale(95)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#B794FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </radialGradient>
  </defs>

  <rect width="1448" height="1086" fill="#F7F8FC"/>
  <rect x="34" y="34" width="1380" height="1018" rx="28" fill="url(#grid)"/>
  <rect x="34" y="34" width="1380" height="1018" rx="28" fill="#FFFFFF" fill-opacity="0.62" stroke="#DCE1EC"/>

  <!-- orbital background -->
  <g id="orbits" opacity="0.75">
    <ellipse cx="470" cy="725" rx="130" ry="96" stroke="#A6B0C4" stroke-opacity="0.35" stroke-dasharray="4 8"/>
    <ellipse cx="915" cy="305" rx="120" ry="82" stroke="#A6B0C4" stroke-opacity="0.32" stroke-dasharray="4 8"/>
    <ellipse cx="738" cy="533" rx="240" ry="176" stroke="#A6B0C4" stroke-opacity="0.32" stroke-dasharray="4 8"/>
  </g>

  <!-- Z infrastructure -->
  <g id="zuam-z" filter="url(#shadow)" stroke="#071226" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 210H920L755 375" stroke-width="78"/>
    <path d="M430 820L1015 235" stroke-width="58"/>
    <path d="M580 625L705 500" stroke-width="56"/>
    <path d="M565 810H1040" stroke-width="78"/>
  </g>

  <!-- neon routes -->
  <g id="flow-lines" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M395 226H900" stroke="#8B5CF6" stroke-width="5"/>
    <path d="M395 240H860" stroke="#60A5FA" stroke-width="3" opacity="0.78"/>
    <path d="M430 808L1010 238" stroke="url(#neon)" stroke-width="6"/>
    <path d="M565 790H1030" stroke="#2DD4BF" stroke-width="5"/>
    <path d="M565 775H980" stroke="#8B5CF6" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- control nodes -->
  <g id="nodes">
    <g transform="translate(390 210)"><circle r="56" fill="#071226"/><circle r="29" fill="#fff"/><circle r="12" fill="#8B5CF6"/></g>
    <g transform="translate(920 210)"><circle r="56" fill="#071226"/><circle r="29" fill="#fff"/><circle r="12" fill="#8B5CF6"/></g>
    <g transform="translate(430 810)"><circle r="56" fill="#071226"/><circle r="29" fill="#fff"/><circle r="12" fill="#2DD4BF"/></g>
    <g transform="translate(1040 810)"><circle r="56" fill="#071226"/><circle r="29" fill="#fff"/><circle r="12" fill="#2DD4BF"/></g>
    <g transform="translate(724 543)"><circle r="62" fill="#8B5CF6" fill-opacity="0.75"/><circle r="41" fill="#fff"/><path d="M724 493C736 528 747 539 782 543C747 555 736 566 724 601C712 566 701 555 666 543C701 539 712 528 724 493Z" fill="url(#violetCore)"/></g>
  </g>

  <!-- labels -->
  <g id="labels" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="700" fill="#071226">
    <rect x="130" y="210" width="185" height="82" rx="16" fill="#fff" stroke="#DDE2EC" filter="url(#shadow)"/>
    <text x="160" y="258" font-size="22">Input signals</text>
    <circle cx="161" cy="278" r="5" fill="#2DD4BF"/><text x="178" y="284" font-size="13" font-weight="500" fill="#778096">Live</text>

    <rect x="1126" y="212" width="210" height="82" rx="16" fill="#fff" stroke="#DDE2EC" filter="url(#shadow)"/>
    <text x="1155" y="258" font-size="22">Pattern recognition</text>
    <circle cx="1156" cy="278" r="5" fill="#8B5CF6"/><text x="1173" y="284" font-size="13" font-weight="500" fill="#778096">Analyzing</text>

    <rect x="165" y="610" width="150" height="82" rx="16" fill="#fff" stroke="#DDE2EC" filter="url(#shadow)"/>
    <text x="195" y="655" font-size="22">Automation</text>
    <circle cx="196" cy="675" r="5" fill="#8B5CF6"/><text x="213" y="681" font-size="13" font-weight="500" fill="#778096">Active</text>

    <rect x="1110" y="688" width="130" height="82" rx="16" fill="#fff" stroke="#DDE2EC" filter="url(#shadow)"/>
    <text x="1140" y="733" font-size="22">Scale</text>
    <circle cx="1141" cy="753" r="5" fill="#2DD4BF"/><text x="1158" y="759" font-size="13" font-weight="500" fill="#778096">Optimizing</text>
  </g>

  <!-- legend chips -->
  <g id="chips" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#071226">
    <rect x="420" y="930" width="180" height="56" rx="28" fill="#fff" stroke="#DDE2EC"/>
    <circle cx="464" cy="958" r="10" fill="#8B5CF6"/><text x="490" y="965">Signal</text>
    <rect x="630" y="930" width="190" height="56" rx="28" fill="#fff" stroke="#DDE2EC"/>
    <circle cx="675" cy="958" r="10" fill="#2DD4BF"/><text x="700" y="965">System</text>
    <rect x="850" y="930" width="180" height="56" rx="28" fill="#fff" stroke="#DDE2EC"/>
    <circle cx="895" cy="958" r="10" fill="#8B5CF6"/><text x="920" y="965">Scale</text>
  </g>
</svg>
