server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Caddy terminates HTTPS outside this container. Keep redirects relative so
  # Nginx never exposes its internal http://:8080 address to the browser.
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /truco {
    return 302 /truco/;
  }

  location /truco/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /truco/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /truco/index.html;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
