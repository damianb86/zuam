name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the app .env}

services:
  static:
    build:
      context: .
      dockerfile: ${STATIC_DOCKERFILE:-Dockerfile.static}
      args:
        NEXT_PUBLIC_ZUAM_API_BASE_URL: ${NEXT_PUBLIC_ZUAM_API_BASE_URL:-/api}
        NEXT_PUBLIC_OPENAI_CHAT_ASSISTANT_NAME: ${NEXT_PUBLIC_OPENAI_CHAT_ASSISTANT_NAME:-Zuam AI Assistant}
        NEXT_PUBLIC_OPENAI_CHAT_MODEL_LABEL: ${NEXT_PUBLIC_OPENAI_CHAT_MODEL_LABEL:-GPT-5.6 Luna}
        NEXT_PUBLIC_ZUAM_CONTACT_EMAIL: ${NEXT_PUBLIC_ZUAM_CONTACT_EMAIL:-contact@zuam.com}
        NEXT_PUBLIC_CHAT_CONTACT_INITIAL_CAPTURE_DELAY_MS: ${NEXT_PUBLIC_CHAT_CONTACT_INITIAL_CAPTURE_DELAY_MS:-180000}
        NEXT_PUBLIC_CHAT_CONTACT_FOLLOWUP_CAPTURE_DELAY_MS: ${NEXT_PUBLIC_CHAT_CONTACT_FOLLOWUP_CAPTURE_DELAY_MS:-180000}
    env_file:
      - .env
    restart: unless-stopped
    init: true
    expose:
      - "8080"
    labels:
      observability.stack: qorve
      observability.app: zuam
      observability.service: static
      caddy: ${APP_HOST:?Set APP_HOST in the app .env}
      caddy.encode: zstd gzip
      # Catch-all: se evalúa último, después de /api/* y /j/* (servicio api).
      caddy.9_handle: /*
      caddy.9_handle.0_reverse_proxy: "{{upstreams 8080}}"
      caddy_ingress_network: ${SHARED_DOCKER_NETWORK:-shared_apps}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
    networks:
      - shared_apps

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the app .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6-luna}
      OPENAI_CHAT_MAX_OUTPUT_TOKENS: ${OPENAI_CHAT_MAX_OUTPUT_TOKENS:-800}
      OPENAI_CHAT_REASONING_EFFORT: ${OPENAI_CHAT_REASONING_EFFORT:-low}
      OPENAI_CHAT_VERBOSITY: ${OPENAI_CHAT_VERBOSITY:-low}
      OPENAI_SCOPE_GUARD_ENABLED: ${OPENAI_SCOPE_GUARD_ENABLED:-true}
      OPENAI_OUTPUT_GUARD_ENABLED: ${OPENAI_OUTPUT_GUARD_ENABLED:-true}
      OPENAI_SCOPE_GUARD_MODEL: ${OPENAI_SCOPE_GUARD_MODEL:-}
      OPENAI_SCOPE_GUARD_REASONING_EFFORT: ${OPENAI_SCOPE_GUARD_REASONING_EFFORT:-low}
      OPENAI_API_TIMEOUT_MS: ${OPENAI_API_TIMEOUT_MS:-45000}
      ZUAM_CONTACT_EMAIL: ${NEXT_PUBLIC_ZUAM_CONTACT_EMAIL:-contact@zuam.com}
      CONTACT_DELIVERY_METHOD: ${CONTACT_DELIVERY_METHOD:-resend}
      CHAT_CONTACT_EMAIL_ENABLED: ${CHAT_CONTACT_EMAIL_ENABLED:-true}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-contact@zuam.com}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Zuam Website <noreply@zuam.dev>}
      RESEND_TIMEOUT_MS: ${RESEND_TIMEOUT_MS:-15000}
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
      CONTACT_WEBHOOK_SECRET: ${CONTACT_WEBHOOK_SECRET:-}
      CONTACT_WEBHOOK_TIMEOUT_MS: ${CONTACT_WEBHOOK_TIMEOUT_MS:-15000}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Zuam Website}
      EMAIL_TIMEOUT_MS: ${EMAIL_TIMEOUT_MS:-15000}
      JUNTADA_DATABASE_URL: ${JUNTADA_DATABASE_URL:-}
      JUNTADA_DB_POOL_MAX: ${JUNTADA_DB_POOL_MAX:-4}
      TRUCO_INDEX_PATH: ${TRUCO_INDEX_PATH:-./static-apps/truco/index.html}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-12}
      CHAT_SESSION_RATE_LIMIT_PER_MINUTE: ${CHAT_SESSION_RATE_LIMIT_PER_MINUTE:-6}
      CHAT_SESSION_DAILY_LIMIT: ${CHAT_SESSION_DAILY_LIMIT:-30}
      CHAT_IP_DAILY_LIMIT: ${CHAT_IP_DAILY_LIMIT:-120}
      CHAT_MIN_SESSION_AGE_MS: ${CHAT_MIN_SESSION_AGE_MS:-1200}
      CHAT_MAX_MESSAGES_PER_REQUEST: ${CHAT_MAX_MESSAGES_PER_REQUEST:-18}
      CHAT_MAX_LATEST_MESSAGE_CHARS: ${CHAT_MAX_LATEST_MESSAGE_CHARS:-2000}
      CONTACT_RATE_LIMIT_PER_MINUTE: ${CONTACT_RATE_LIMIT_PER_MINUTE:-5}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-131072}
    labels:
      observability.stack: qorve
      observability.app: zuam
      observability.service: api
      caddy: ${APP_HOST:?Set APP_HOST in the app .env}
      caddy.0_handle_path: /api/*
      caddy.0_handle_path.0_reverse_proxy: "{{upstreams 3000}}"
      # Las páginas de juntada las sirve la API (necesitan Open Graph dinámico
      # para la preview de WhatsApp, y el landing se exporta estático).
      caddy.1_handle: /j/*
      caddy.1_handle.0_reverse_proxy: "{{upstreams 3000}}"
      caddy_ingress_network: ${SHARED_DOCKER_NETWORK:-shared_apps}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
    networks:
      - shared_apps

networks:
  shared_apps:
    external: true
    name: ${SHARED_DOCKER_NETWORK:-shared_apps}
